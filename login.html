<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#08080A">
    <title>PROTEC - Login Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="brand.js" defer></script>
</head>
<body>
<div class="lg">
  <aside class="lg__stage">
    <a href="index.html" class="lg__back"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Volver al inicio</a>
    <div><h1>Acceso <em>seguro</em> al panel</h1><p>Gestiona catálogo, cotizaciones y solicitudes desde un solo lugar.</p></div>
    <div class="brand"><span class="brand-mark" data-brand-mark><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span><span class="brand-name" data-brand-name>PROTEC</span></div>
  </aside>
  <main class="lg__panel"><section class="lg__card" id="card">
    <span class="eyebrow">Administración</span><h2>Iniciar sesión</h2><p>Ingresa con tu cuenta de administrador.</p>
    <form id="loginForm" autocomplete="on" novalidate>
      <div class="field"><label class="lbl" for="email">Correo electrónico</label><div class="box"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input type="email" id="email" placeholder="correo@protec.ink" required maxlength="254" autocomplete="email" spellcheck="false" autocapitalize="none"></div></div>
      <div class="field"><label class="lbl" for="password">Contraseña</label><div class="box"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="password" id="password" placeholder="••••••••" required maxlength="128" autocomplete="current-password"><button type="button" class="eye" id="togglePass" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="hint" id="capsHint"></div></div>
      <div id="errorMsg" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn btn-primary lgbtn" id="btnLogin"><span class="label">Iniciar sesión</span><span class="spin"><i></i></span></button>
    </form>
    <p class="lg__foot">Acceso restringido · Conexión protegida</p>
  </section></main>
</div>
<script>
    (function () {
        'use strict';
        var SESSION_KEY = 'protec_session', GUARD_KEY = 'protec_login_guard';
        var SESSION_TTL = 8 * 60 * 60 * 1000;                       // sesión máxima: 8 h
        var LOCKS = [[3, 30], [5, 120], [7, 300], [10, 900]];       // [fallos, segundos de bloqueo]
        var EMAIL_RE = /^[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9.\-]{1,190}\.[A-Za-z]{2,24}$/;
        var $ = function (id) { return document.getElementById(id); };
        var form = $('loginForm'), emailEl = $('email'), passEl = $('password'),
            errEl = $('errorMsg'), btn = $('btnLogin'), label = btn.querySelector('.label'),
            card = $('card'), caps = $('capsHint'), busy = false, timer = null;
        var LABEL = label.textContent;

        function now() { return Date.now(); }
        function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function randHex(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }

        /* ── Sesión previa válida → directo al panel ── */
        try {
            var s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
            if (s && s.v === 1 && s.exp > now() && now() - s.last < 30 * 60 * 1000) { location.replace('admin.html'); return; }
            localStorage.removeItem(SESSION_KEY);
        } catch (e) { try { localStorage.removeItem(SESSION_KEY); } catch (_) {} }
        try { localStorage.removeItem('protec_auth'); localStorage.removeItem('protec_user'); } catch (e) {}

        /* ── Anti fuerza bruta (frontend) ── */
        function getGuard() {
            try { var g = JSON.parse(localStorage.getItem(GUARD_KEY) || '{}');
                  var o = { fails: +g.fails || 0, until: +g.until || 0, last: +g.last || 0 };
                  if (o.last && now() - o.last > 30 * 60 * 1000) { o.fails = 0; o.until = 0; }
                  return o; } catch (e) { return { fails: 0, until: 0, last: 0 }; }
        }
        function setGuard(g) { try { localStorage.setItem(GUARD_KEY, JSON.stringify(g)); } catch (e) {} }
        function lockSeconds(f) { var s = 0; LOCKS.forEach(function (l) { if (f >= l[0]) s = l[1]; }); return s; }
        function fmt(ms) { var t = Math.ceil(ms / 1000), m = Math.floor(t / 60), s = t % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

        function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
        function hideError() { errEl.style.display = 'none'; }
        function shake() { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
        function setBusy(v) { busy = v; btn.disabled = v; btn.classList.toggle('is-loading', v); }

        function tickLock() {
            var g = getGuard(), left = g.until - now();
            if (left > 0) {
                btn.disabled = true; label.textContent = 'BLOQUEADO ' + fmt(left);
                showError('Demasiados intentos fallidos. Espera ' + fmt(left) + ' para volver a intentar.');
                if (!timer) timer = setInterval(tickLock, 1000);
            } else {
                if (timer) { clearInterval(timer); timer = null; }
                if (!busy) { btn.disabled = false; label.textContent = LABEL; }
                if (g.until) hideError();
            }
        }
        tickLock();

        /* ── Utilidades UI ── */
        $('togglePass').addEventListener('click', function () {
            var show = passEl.type === 'password'; passEl.type = show ? 'text' : 'password';
            this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
        passEl.addEventListener('keyup', function (e) {
            caps.textContent = (e.getModifierState && e.getModifierState('CapsLock')) ? 'Bloq Mayús activado' : '';
        });
        [emailEl, passEl].forEach(function (el) { el.addEventListener('input', function () { if (!getGuard().until || getGuard().until < now()) hideError(); }); });

        /* ── Envío ── */
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (busy) return;
            var g = getGuard();
            if (g.until > now()) { tickLock(); shake(); return; }

            // Validación y sanitización (el correo no admite < > " ' ; ni espacios)
            var email = emailEl.value.replace(/[\u0000-\u001f\u007f]/g, '').trim().toLowerCase();
            var pass = passEl.value.trim();
            if (!EMAIL_RE.test(email) || email.length > 254) { showError('Ingresa un correo electrónico válido.'); shake(); return; }
            if (pass.length < 1 || pass.length > 128 || /[\u0000-\u001f\u007f]/.test(pass)) { showError('La contraseña no es válida.'); shake(); return; }

            hideError(); setBusy(true);
            await sleep(450 + Math.random() * 450);   // retardo uniforme: dificulta automatizar intentos

            try {
                var res = await window.supabaseClient.from('usuarios_admin')
                    .select('id,email,nombre').eq('email', email).eq('password', pass).maybeSingle();

                if (res.error) { setBusy(false); showError('Error de conexión con el servidor. Intenta de nuevo.'); return; }

                if (!res.data) {
                    var f = (getGuard().fails || 0) + 1, secs = lockSeconds(f);
                    setGuard({ fails: f, last: now(), until: secs ? now() + secs * 1000 : 0 });
                    setBusy(false); shake();
                    if (secs) tickLock(); else showError('Credenciales incorrectas o usuario no registrado.');
                    return;
                }

                setGuard({ fails: 0, until: 0, last: 0 });
                var t = now();
                localStorage.setItem(SESSION_KEY, JSON.stringify({ v: 1, email: res.data.email, nombre: res.data.nombre || '', iat: t, last: t, exp: t + SESSION_TTL, sid: randHex(16) }));
                label.textContent = 'ACCEDIENDO…';
                location.replace('admin.html');
            } catch (err) {
                setBusy(false); showError('Error de conexión con el servidor. Intenta de nuevo.');
            }
        });
    })();
    </script>
</body>
</html>
