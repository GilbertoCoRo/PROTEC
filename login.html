<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTEC - Login Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://jqehwpfgrzbgixyscvcy.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZWh3cGZncnpiZ2l4eXNjdmN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzQ2MzYsImV4cCI6MjA5MzU1MDYzNn0.u_ar9zJobhU8XSaghoLjo5x1PG6ms0rH70ldae1Xkx4';
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative;">

    <!-- BOTÓN REGRESAR AL INDEX -->
    <a href="index.html" style="position: absolute; top: 20px; left: 20px; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); transition: all 0.3s;">
        ← Volver al Inicio
    </a>

    <div class="card" style="max-width: 450px; width: 90%;">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h1 class="accent" style="font-size: 2rem;">🛡️ PROTEC</h1>
            <p>Panel de Administración</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>CORREO ELECTRÓNICO</label>
                <input type="email" id="email" placeholder="correo@protec.ink" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <!-- ALERTA DE ERROR -->
            <div id="errorMsg" style="background: rgba(255, 107, 107, 0.1); border: 1px solid #ff6b6b; color: #ff6b6b; padding: 12px; border-radius: 6px; margin-bottom: 1rem; display: none; text-align: center; font-size: 0.9rem;"></div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">INICIAR SESIÓN</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = localStorage.getItem('protec_auth');
            if(auth === 'true') {
                window.location.replace('admin.html');
                return;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            try {
                const { data, error } = await window.supabaseClient
                    .from('usuarios_admin')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !data) {
                    errorMsg.textContent = '❌ Credenciales incorrectas o usuario no registrado.';
                    errorMsg.style.display = 'block';
                    
                    const form = document.querySelector('.card');
                    form.style.animation = 'shake 0.5s';
                    setTimeout(() => { form.style.animation = ''; }, 500);
                    setTimeout(() => { errorMsg.style.display = 'none'; }, 4000);
                    return;
                }

                localStorage.setItem('protec_auth', 'true');
                localStorage.setItem('protec_user', data.email);
                
                window.location.replace('admin.html');
            } catch (err) {
                console.error('Error en login:', err);
                errorMsg.textContent = '❌ Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            }
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
